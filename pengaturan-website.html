<!doctype html>
<html lang="id">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        Pengaturan Website · Admin Desa Fataatu Timur
    </title>

    <link
        rel="icon"
        href="assets/img/logo.svg"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background:#f4f8f6;
            font-family:Arial,sans-serif;
        }

        .sidebar {
            width:255px;
            min-height:100vh;
            background:#0d4939;
            color:white;
            position:fixed;
            left:0;
            top:0;
            padding:25px 16px;
        }

        .sidebar a {
            display:block;
            color:white;
            text-decoration:none;
            padding:12px 14px;
            margin:4px 0;
            border-radius:10px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background:rgba(255,255,255,.13);
        }

        .content {
            margin-left:255px;
            padding:30px;
        }

        .card-admin {
            background:white;
            border:0;
            border-radius:18px;
            box-shadow:0 5px 25px rgba(0,0,0,.06);
        }

        label {
            font-weight:600;
            margin-bottom:7px;
        }

        @media(max-width:768px){

            .sidebar {
                width:100%;
                position:relative;
                min-height:auto;
            }

            .content {
                margin-left:0;
            }

        }

    </style>

</head>


<body>


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="mb-4">

        <h5 class="fw-bold mb-1">
            ADMIN DESA
        </h5>

        <small>
            Desa Fataatu Timur
        </small>

    </div>


    <a href="admin.html">

        <i class="bi bi-speedometer2 me-2"></i>

        Dashboard

    </a>


    <a href="admin.html#transparansi">

        <i class="bi bi-file-earmark-text me-2"></i>

        Transparansi

    </a>


    <a href="admin.html#faq">

        <i class="bi bi-question-circle me-2"></i>

        FAQ

    </a>


    <a href="pesan-masuk.html">

        <i class="bi bi-envelope me-2"></i>

        Pesan Masuk

    </a>


    <a
        href="pengaturan-website.html"
        class="active"
    >

        <i class="bi bi-gear me-2"></i>

        Pengaturan Website

    </a>


    <hr>


    <a href="index.html">

        <i class="bi bi-globe me-2"></i>

        Lihat Website

    </a>


    <a
        href="#"
        id="logoutBtn"
    >

        <i class="bi bi-box-arrow-right me-2"></i>

        Logout

    </a>

</aside>


<!-- CONTENT -->

<main class="content">

    <div class="mb-4">

        <h2 class="fw-bold mb-1">
            Pengaturan Website
        </h2>

        <p class="text-muted">
            Atur identitas dan informasi kontak
            Desa Fataatu Timur.
        </p>

    </div>


    <div class="card-admin p-4">

        <form id="settingsForm">


            <h5 class="fw-bold mb-4">
                Identitas Website
            </h5>


            <div class="row g-4">


                <div class="col-md-6">

                    <label>
                        Nama Desa
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label>
                        Nama Website
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="website_name"
                    >

                </div>


                <div class="col-12">

                    <label>
                        Deskripsi Website
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        rows="4"
                    ></textarea>

                </div>


                <div class="col-md-6">

                    <label>
                        Lokasi
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="location"
                    >

                </div>


                <div class="col-md-6">

                    <label>
                        Alamat Kantor Desa
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="address"
                    >

                </div>


                <div class="col-md-6">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                    >

                </div>


                <div class="col-md-6">

                    <label>
                        Nomor Telepon
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="phone"
                    >

                </div>


                <div class="col-md-6">

                    <label>
                        Kode Pos
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="postal_code"
                    >

                </div>


                <div class="col-md-6">

                    <label>
                        Jam Pelayanan
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="office_hours"
                        placeholder="Senin - Jumat, 08.00 - 15.00 WITA"
                    >

                </div>


                <div class="col-12">

                    <label>
                        URL Logo
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="logo_url"
                        placeholder="https://..."
                    >

                </div>


            </div>


            <hr class="my-4">


            <div
                id="statusMessage"
                class="mb-3"
            ></div>


            <button
                type="submit"
                class="btn btn-success px-4"
                id="saveButton"
            >

                <i class="bi bi-save me-2"></i>

                Simpan Pengaturan

            </button>


        </form>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase-config.js"></script>


<script>

"use strict";


let sb = null;

let settingId = null;


// =========================================================
// CLIENT
// =========================================================

function getSupabase() {

    if (sb) {
        return sb;
    }


    sb =
        window.supabase.createClient(
            window.SUPABASE_CONFIG.url,
            window.SUPABASE_CONFIG.key
        );


    return sb;

}


// =========================================================
// ELEMENT
// =========================================================

const form =
    document.getElementById(
        "settingsForm"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


// =========================================================
// LOAD
// =========================================================

async function loadSettings() {

    const client =
        getSupabase();


    const result =
        await client
            .from("site_settings")
            .select("*")
            .limit(1)
            .maybeSingle();


    if (result.error) {

        console.error(
            result.error
        );


        statusMessage.innerHTML = `

            <div class="alert alert-danger">

                Gagal mengambil pengaturan website.

                <br>

                ${escapeHtml(
                    result.error.message
                )}

            </div>

        `;

        return;

    }


    const data =
        result.data;


    if (!data) {

        statusMessage.innerHTML = `

            <div class="alert alert-warning">

                Data pengaturan website belum ada.

            </div>

        `;

        return;

    }


    settingId =
        data.id;


    document.getElementById(
        "name"
    ).value =
        data.name || "";


    document.getElementById(
        "website_name"
    ).value =
        data.website_name || "";


    document.getElementById(
        "description"
    ).value =
        data.description || "";


    document.getElementById(
        "location"
    ).value =
        data.location || "";


    document.getElementById(
        "address"
    ).value =
        data.address || "";


    document.getElementById(
        "email"
    ).value =
        data.email || "";


    document.getElementById(
        "phone"
    ).value =
        data.phone || "";


    document.getElementById(
        "postal_code"
    ).value =
        data.postal_code ||
        data.postal ||
        "";


    document.getElementById(
        "office_hours"
    ).value =
        data.office_hours ||
        data.hours ||
        "";


    document.getElementById(
        "logo_url"
    ).value =
        data.logo_url || "";

}


// =========================================================
// SAVE
// =========================================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        saveButton.disabled =
            true;


        saveButton.innerHTML = `

            <span
                class="spinner-border spinner-border-sm me-2"
            ></span>

            Menyimpan...

        `;


        const client =
            getSupabase();


        const data = {

            name:
                document.getElementById(
                    "name"
                ).value.trim(),


            website_name:
                document.getElementById(
                    "website_name"
                ).value.trim(),


            description:
                document.getElementById(
                    "description"
                ).value.trim(),


            location:
                document.getElementById(
                    "location"
                ).value.trim(),


            address:
                document.getElementById(
                    "address"
                ).value.trim(),


            email:
                document.getElementById(
                    "email"
                ).value.trim(),


            phone:
                document.getElementById(
                    "phone"
                ).value.trim(),


            postal_code:
                document.getElementById(
                    "postal_code"
                ).value.trim(),


            office_hours:
                document.getElementById(
                    "office_hours"
                ).value.trim(),


            logo_url:
                document.getElementById(
                    "logo_url"
                ).value.trim()

        };


        let result;


        if (settingId) {

            result =
                await client
                    .from(
                        "site_settings"
                    )
                    .update(data)
                    .eq(
                        "id",
                        settingId
                    );

        } else {

            result =
                await client
                    .from(
                        "site_settings"
                    )
                    .insert(data);

        }


        if (result.error) {

            console.error(
                result.error
            );


            statusMessage.innerHTML = `

                <div class="alert alert-danger">

                    <strong>
                        Gagal menyimpan.
                    </strong>

                    <br>

                    ${escapeHtml(
                        result.error.message
                    )}

                </div>

            `;

        } else {

            statusMessage.innerHTML = `

                <div class="alert alert-success">

                    <i class="bi bi-check-circle me-2"></i>

                    Pengaturan website berhasil disimpan.

                    <br>

                    Perubahan akan digunakan oleh website.

                </div>

            `;


            await loadSettings();

        }


        saveButton.disabled =
            false;


        saveButton.innerHTML = `

            <i class="bi bi-save me-2"></i>

            Simpan Pengaturan

        `;

    }
);


// =========================================================
// ESCAPE
// =========================================================

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(m) {

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        }
    );

}


// =========================================================
// LOGOUT
// =========================================================

document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        async function(e) {

            e.preventDefault();


            const client =
                getSupabase();


            await client.auth.signOut();


            window.location.href =
                "admin-login.html";

        }
    );


// =========================================================
// START
// =========================================================

document.addEventListener(
    "DOMContentLoaded",
    loadSettings
);

</script>


</body>

</html>
